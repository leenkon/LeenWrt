name: LeenWrtBuilder_x86_64
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      version: {description: '版本 ', required: true, type: choice, options: ['25.12.1', '25.12.0'], default: '25.12.1'}
      profile: {description: '配置 (Full=主路由/Mini=旁路由)', required: true, type: choice, options: [Full, Mini], default: 'Full'}
      custom_ip: {description: '自定义IP', type: string, default: ''}
      custom_gateway: {description: '网关(旁路由)', type: string, default: ''}
      pppoe_username: {description: 'PPPoE账号', type: string, default: ''}
      pppoe_password: {description: 'PPPoE密码', type: string, default: ''}
      with_fwx: {description: '包含fwx应用过滤', type: boolean, default: true}
      with_oc: {description: '包含OpenClash代理(Mini强制开启)', type: boolean, default: true}
      with_adgh: {description: '包含AdGuardHome去广告(Mini强制开启)', type: boolean, default: true}
      root_password: {description: 'root密码', type: string, default: ''}
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: .

      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 同步 fwx 核心(发版前按 FWX_COMMIT 跟随上游)
        if: ${{ github.event.inputs.with_fwx == 'true' }}
        run: |
          set -e
          chmod +x $GITHUB_WORKSPACE/scripts/sync-fwx.sh
          # 拉取 kmod-fwx 到 feeds/fwx/fwx（构建产物，已被 .gitignore 忽略），并刷新 950 内核补丁与 FWX_COMMIT 钉点
          $GITHUB_WORKSPACE/scripts/sync-fwx.sh
          echo "[ci] fwx 核心已同步（FWX_COMMIT 见 cores/leenwrt.conf）"

      - name: 拉取源码
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/leenwrt.conf
          SRC_REF="${REF_PREFIX}${{ github.event.inputs.version }}"
          rm -rf openwrt
          # 直接按 SRC_REF（tag）克隆检出，避免浅克隆 fetch 后无本地 ref 致 checkout 失败
          timeout 180 git clone --depth 1 --single-branch --branch "$SRC_REF" "$REPO_URL" openwrt

      - name: 配置与编译
        id: build
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/leenwrt.conf
          FEEDS_FILE_ABS="$GITHUB_WORKSPACE/$FEEDS_FILE"
          FILES_DIR_ABS="$GITHUB_WORKSPACE/$FILES_DIR"
          # 修复 Windows 提交可能带来的 CRLF（路由器 ash 不兼容），覆盖脚本/YAML/init.d
          find $GITHUB_WORKSPACE -type f \( -name "*.sh" -o -name "*.yaml" -o -name "dns-hijack" -o -name "99-adgh-filters" -o -path "*/init.d/*" \) \
            -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          cd openwrt
          case "${{ github.event.inputs.profile }}" in
            Full) CFG_PREFIX=full; RUN_TYPE=full;;
            Mini) CFG_PREFIX=mini; RUN_TYPE=bypass;;
            *) echo "未知 profile: ${{ github.event.inputs.profile }}"; exit 1;;
          esac
          MAIN_VER="${{ github.event.inputs.version }}"; MAIN_VER="${MAIN_VER%.*}"

          # OC/ADGH：旁路由(Mini)固定启用；完整路由(Full)由 Workflow 勾选决定
          WITH_OC=${{ github.event.inputs.with_oc }}
          WITH_ADGH=${{ github.event.inputs.with_adgh }}
          [[ "$RUN_TYPE" == "bypass" ]] && { WITH_OC=true; WITH_ADGH=true; }
          NO_ADGH="false"; [ "$WITH_ADGH" = "true" ] || NO_ADGH="true"

          WITH_FWX=${{ github.event.inputs.with_fwx }}
          # 显式门控：避免 ${WITH_FWX:+"--with-fwx"} 在 WITH_FWX="false" 时（非空串）误展开成 --with-fwx
          FWX_FLAG=""; [ "$WITH_FWX" = "true" ] && FWX_FLAG="--with-fwx"
          OC_FLAG="";  [ "$WITH_OC"  = "true" ] && OC_FLAG="--with-oc"

          chmod +x $GITHUB_WORKSPACE/scripts/diy.sh
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p before -t $RUN_TYPE --feeds "$FEEDS_FILE_ABS" $FWX_FLAG
          ./scripts/feeds update -a

          if $WITH_OC; then
            chmod +x $GITHUB_WORKSPACE/scripts/upgrade-openclash-luci.sh
            $GITHUB_WORKSPACE/scripts/upgrade-openclash-luci.sh .
          fi

          # AdGuardHome LuCI 壳去除对引擎包(adguardhome)的硬依赖（leenwrt 25.12；引擎走二进制注入）
          if [ "$MAIN_VER" = "25.12" ]; then
            ADGH_LUCI_MK="feeds/luci/applications/luci-app-adguardhome/Makefile"
            if [ -f "$ADGH_LUCI_MK" ]; then
              sed -i -e 's/+adguardhome //g' -e '/LUCI_EXTRA_DEPENDS:=adguardhome/d' "$ADGH_LUCI_MK"
              echo "[build] 已去除 luci-app-adguardhome 对 adguardhome 的硬依赖（引擎走二进制注入）"
            else
              echo "[build] 警告: 未找到 luci-app-adguardhome Makefile，跳过依赖去除"
            fi
          fi

          ./scripts/feeds install -a -f
          cp $GITHUB_WORKSPACE/configs/${CONFIG_PREFIX}-${CFG_PREFIX}.config .config
          sed -i 's/\r$//' .config

          # fwx 应用过滤（可选）：kmod-fwx 由 sync-fwx.sh 在构建前按 FWX_COMMIT 动态拉取；15 个 luci-app-fwx-* 经 src-git fwxluci
          if $WITH_FWX; then
            FWX_LIST="$GITHUB_WORKSPACE/feeds/fwx/fwx-packages.list"
            if [ -f "$FWX_LIST" ]; then
              {
                echo ""
                echo "# ===== fwx 应用过滤栈（kmod-fwx/fwxd/libfwx_common 经 src-link fwx；15 个 luci-app-fwx-* 经 src-git fwxluci）====="
                while read -r pkg; do
                  [ -n "$pkg" ] && [ "${pkg#\#}" = "$pkg" ] && echo "CONFIG_PACKAGE_${pkg}=y"
                done < "$FWX_LIST"
              } >> .config
              echo "[build] 已追加 fwx 应用过滤栈 CONFIG（来自 $FWX_LIST）"
            else
              echo "[build] 警告: 未找到 fwx 包清单 $FWX_LIST，跳过 fwx CONFIG 注入"
            fi
          fi

          # OpenClash / AdGuardHome 选装包（勾选时注入，复用 fwx 包清单模式；清单单一来源 configs/{oc,adgh}-packages.list）
          if $WITH_OC; then
            OC_LIST="$GITHUB_WORKSPACE/configs/oc-packages.list"
            if [ -f "$OC_LIST" ]; then
              { echo ""; echo "# ===== OpenClash 选装包 ====="; while read -r pkg; do [ -n "$pkg" ] && [ "${pkg#\#}" = "$pkg" ] && echo "CONFIG_PACKAGE_${pkg}=y"; done < "$OC_LIST"; } >> .config
              echo "[build] 已追加 OpenClash 选装包 CONFIG（来自 $OC_LIST）"
            else echo "[build] 警告: 未找到 $OC_LIST，跳过 OC 注入"; fi
          fi
          if $WITH_ADGH; then
            ADGH_LIST="$GITHUB_WORKSPACE/configs/adgh-packages.list"
            if [ -f "$ADGH_LIST" ]; then
              { echo ""; echo "# ===== AdGuardHome 选装包 ====="; while read -r pkg; do [ -n "$pkg" ] && [ "${pkg#\#}" = "$pkg" ] && echo "CONFIG_PACKAGE_${pkg}=y"; done < "$ADGH_LIST"; } >> .config
              echo "[build] 已追加 AdGuardHome 选装包 CONFIG（来自 $ADGH_LIST）"
            else echo "[build] 警告: 未找到 $ADGH_LIST，跳过 ADGH 注入"; fi
          fi

          ROOTPWD="${{ github.event.inputs.root_password }}"; ROOTPWD="${ROOTPWD:-password}"
          CIP="${{ github.event.inputs.custom_ip }}"; CGW="${{ github.event.inputs.custom_gateway }}"
          PUSER="${{ github.event.inputs.pppoe_username }}"; PPASS="${{ github.event.inputs.pppoe_password }}"
          NOADGH_ARG=""
          [ "$NO_ADGH" = "true" ] && NOADGH_ARG="--no-adgh"
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p after -t $RUN_TYPE --files-dir "$FILES_DIR_ABS" \
            ${CIP:+--ip "$CIP"} ${CGW:+--gateway "$CGW"} \
            ${PUSER:+--pppoe-user "$PUSER"} ${PPASS:+--pppoe-pass "$PPASS"} \
            ${NOADGH_ARG:+"$NOADGH_ARG"} \
            $FWX_FLAG $OC_FLAG \
            --root-pass "$ROOTPWD"

          $WITH_OC && { chmod +x $GITHUB_WORKSPACE/scripts/upgrade-openclash-core.sh; $GITHUB_WORKSPACE/scripts/upgrade-openclash-core.sh $GITHUB_WORKSPACE --files-dir "$FILES_DIR_ABS"; } || true
          if $WITH_ADGH; then
            chmod +x $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh
            $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh $GITHUB_WORKSPACE --files-dir "$FILES_DIR_ABS"
          fi
          [[ -d "$FILES_DIR_ABS" ]] && { rm -rf files; cp -rf "$FILES_DIR_ABS" files; } || true

          # 离线 .apk：拷入镜像首启安装目录（由 firstboot-pkgs 用 --allow-untrusted 安装）
          mkdir -p files/etc/firstboot-pkgs/apps
          cp -f $GITHUB_WORKSPACE/apps/*.apk files/etc/firstboot-pkgs/apps/ 2>/dev/null || true

          # 按勾选删除不需要的静态文件（对齐 build.sh）
          case "$RUN_TYPE" in
            bypass) rm -f files/usr/sbin/dns-hijack;;
            full)
              if [ "$WITH_ADGH" != "true" ]; then
                rm -rf files/etc/adguardhome
                rm -f files/usr/bin/AdGuardHome files/etc/init.d/adguardhome files/etc/config/adguardhome
                rm -f files/usr/sbin/dns-hijack
              fi
              if [ "$WITH_OC" != "true" ]; then
                rm -rf files/etc/openclash
              fi
              ;;
          esac
          find files/ -type f \( -path "*/sbin/*" -o -path "*/init.d/*" -o -path "*/hotplug.d/*" -o -path "*/uci-defaults/*" -o -name "*.sh" \) -exec chmod 755 {} + 2>/dev/null || true
          make defconfig && make download && make clean
          make -j$(nproc) || make -j1 V=s
          TS=$(date +%Y%m%d%H%M%S)
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          shopt -s nullglob; for f in bin/targets/x86/64/*combined.img.gz; do mv "$f" "${f%.img.gz}-$TS.img.gz"; done; shopt -u nullglob

      - name: 上传固件
        uses: softprops/action-gh-release@v2
        with:
          name: leenwrt ${{ github.event.inputs.version }} (${{ github.event.inputs.profile }})
          tag_name: leenwrt-${{ github.event.inputs.version }}-${{ github.event.inputs.profile }}
          files: openwrt/bin/targets/x86/64/*-${{ steps.build.outputs.timestamp }}.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 记录 fwx 钉点(若有更新)
        if: ${{ github.event.inputs.with_fwx == 'true' }}
        run: |
          set -e
          git -C $GITHUB_WORKSPACE config user.name "github-actions[bot]"
          git -C $GITHUB_WORKSPACE config user.email "github-actions[bot]@users.noreply.github.com"
          # 仅记录钉点相关文件（feeds/fwx/fwx 被 .gitignore 忽略，不入仓）
          git -C $GITHUB_WORKSPACE add cores/leenwrt.conf feeds/fwx/README.md patches/fwx/
          if ! git -C $GITHUB_WORKSPACE diff --cached --quiet; then
            SHA=$(grep -m1 '^FWX_COMMIT=' $GITHUB_WORKSPACE/cores/leenwrt.conf | cut -d= -f2 | tr -d '"')
            git -C $GITHUB_WORKSPACE commit -m "chore(fwx): pre-release sync FWX_COMMIT $SHA [skip ci]"
            git -C $GITHUB_WORKSPACE push origin "$GITHUB_REF_NAME"
            echo "[ci] fwx 钉点已更新并推送: $SHA"
          else
            echo "[ci] fwx 钉点无变化，跳过提交"
          fi
