src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12
src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12
# 注：immortalwrt/packages 与 luci 上游未发布 25.12 版本 tag（git ls-remote 已证实仅有 openwrt-25.12 分支），
# 故 feeds 软件版本只能钉在 openwrt-25.12 分支头（=钉死 25.12 大版本线）。主仓库 immortalwrt 才按
# VERSION_OPTIONS 用 v25.12.x tag 克隆（见 cores/leenwrt.conf REF_PREFIX + build.sh/workflow）。两者版本机制不同，勿混。

# fwx 应用过滤栈：src-link fwx 指向本地 feeds/fwx（kmod-fwx 构建期按 FWX_COMMIT 动态拉取；fwxd/libfwx_common vendored）；15 个 luci-app-fwx-* 走 src-git fwxluci
src-link fwx ./feeds/fwx
src-git fwxluci https://github.com/fanchmwrt/fanchmwrt-packages