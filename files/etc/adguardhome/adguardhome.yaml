schema_version: 34
http:
  address: "0.0.0.0:8030"
  session_ttl: 720h
  pprof:
    enabled: false
    port: 6060
dns:
  port: 5353
  bind_hosts:
    - 0.0.0.0
    - "::"
  # ADGH 仅以 dnsmasq(:53) 为唯一上游；OC 集成交由 dnsmasq 层(server=127.0.0.1#7874 由 uci-defaults 按 OC 是否安装动态注入)决定。
  # 这样 ADGH 不硬依赖 OC：OC 未装/宕时 ADGH 直走 dnsmasq→公网 DNS，无 3s 超时惩罚；OC 在时 dnsmasq 转发 OC 做域名分流。
  upstream_dns:
    - "127.0.0.1:53"          # 本地 dnsmasq :53 常驻兜底（其上游由固件配置设为 OC:7874 + 阿里云，或仅阿里云）
  fallback_dns: []            # 兜底已并入 upstream_dns，避免双路径重复
  parallel_requests: false
  upstream_timeout: 3s
  cache_enabled: true
  cache_size: 500000
  cache_optimistic_ttl: 30s
  cache_optimistic_max_age: 12h
  enable_dnssec: false
filtering:
  protection_enabled: true
  filtering_enabled: true
  blocking_mode: default
  blocked_response_ttl: 3600
  blocked_services:
    ids: []
  parental_enabled: false
  safebrowsing_enabled: false
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
filters:
  - enabled: true
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_21.txt"
    name: "Anti-AD-CHN"
    id: 1
  - enabled: true
    url: "https://easylist-downloads.adblockplus.org/easylistchina+easylist.txt"
    name: "EasyList China"
    id: 2
  - enabled: true
    url: "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
    name: "AdGuard DNS filter"
    id: 3
  - enabled: true
    url: "https://anti-ad.net/easylist.txt"
    name: "Anti-AD"
    id: 4
whitelist_filters: []
user_rules: []
querylog:
  enabled: true
  # 关掉落盘查询日志：ADGH 数据目录在 overlay 闪存，长期写入会撑爆分区导致系统不稳（间歇断流）
  file_enabled: false
  interval: 2160h
  size_memory: 1000
statistics:
  enabled: true
  interval: 24h
  results: 1000
dhcp:
  enabled: false
users:
  - name: admin
    password: "$2b$10$ZEL7fGN0sordgM10nFnFfOh4lfdPXLLJhYeuNfymetjErfPNM9yxe"
