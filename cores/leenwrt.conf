# LeenWrt 核心描述（fork 自 immortalwrt 上游，保持原行为）
# 该文件由 build.sh / workflow source，统一描述单核心的仓库、feeds、config 前缀、应用过滤后端与静态文件目录。
REPO_URL="https://github.com/immortalwrt/immortalwrt"
REF_PREFIX="v"                       # 克隆后按 ${REF_PREFIX}${VERSION} 切换 tag，如 v25.12.1
VERSION_OPTIONS="25.12.0 25.12.1"    # 交互式/Workflow 可选版本
FEEDS_FILE="feeds/25.12.conf"        # 该核心使用的 feeds 配置文件
CONFIG_PREFIX="25.12"                # 配置文件命名: configs/${CONFIG_PREFIX}-${CFG_PREFIX}.config
FILES_DIR="files"                   # 编译期注入的静态文件目录（单核项目即唯一来源，无共享层）

# fwx 四个代码组件(fwx/fwxd/libfwx_common/luci-theme-fanchmwrt)钉点：构建期按 SHA 从 fanchmwrt/package/fcm 动态拉取到 feeds/fwx/（本地 build.sh 用 pull_fcm_package 钉点；CI 用 sync-fwx.sh 跟随分支头并刷新此钉点）
FWX_COMMIT="75d011a8c317d88e6cf78f89403a349cceff2827"
FWX_UPSTREAM_REPO="fanchmwrt/fanchmwrt"
FWX_UPSTREAM_PATH="package/fcm/fwx"
FWX_UPSTREAM_BRANCH="fanchmwrt-25.12.4"

# 950 内核补丁兼容基线：immortalwrt 25.12 内核 6.12 子版本（取自 target/linux/generic/kernel-6.12 的 LINUX_KERNEL_HASH-6.12.xx）。
# 为空=仅打印当前版本不作强制；填值后若当前内核版本不符则 diy.sh fail-fast，防止 950 与内核不对齐的固件编出。
# 默认构建走 v25.12.1 -> 6.12.94；若选 v25.12.0(6.12.87) 会 fail-fast，需同步降级此基线或升级 950。
FWX_KERNEL_BASELINE="6.12.94"

# fanchmwrt 系统主题(luci-theme-fanchmwrt)钉点：同源 package/fcm（与 fwx 共用 FWX_COMMIT 钉点）
THEME_COMMIT="75d011a8c317d88e6cf78f89403a349cceff2827"
THEME_UPSTREAM_PATH="package/fcm/luci-theme-fanchmwrt"
